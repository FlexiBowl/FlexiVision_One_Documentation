server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # HTML — no caching so updates appear immediately after each deploy.
    location ~* \.html?$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Generic fallback (sub-directories with their own index.html, e.g. "V. 0.20/IT/").
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Media is offloaded to S3+CloudFront and is excluded from this image
    # (.dockerignore drops build/_shared/, build/_assets/, build/Offline manual.zip).
    # _shared/ and _assets/ get URL-rewritten in CI; if a request still reaches nginx,
    # the rewrite failed — return a real 404 instead of letting the SPA fallback serve HTML.
    location /_shared/ { return 404; }
    location /_assets/ { return 404; }

    # The "Download offline manual" button is built by JS at runtime against the page
    # origin, so it always resolves to docs.flexibowl.com — we can't rewrite it in CI.
    # Redirect to the CDN so the browser pulls from CloudFront.
    # __CDN_BASE_URL__ is replaced in CI with the value of the CDN_BASE_URL secret.
    location = /Offline%20manual.zip {
        return 302 __CDN_BASE_URL__/Offline%20manual.zip;
    }
}
